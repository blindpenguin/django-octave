name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

jobs:
  # Nothing is published unless lint, unit tests, docs and the end-to-end suites pass.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(uv version --short)"
          echo "tag=${TAG} expected=${EXPECTED} pyproject=${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch: tag ${TAG} vs pyproject.toml ${ACTUAL}"
            exit 1
          fi

      - name: Build release notes from Conventional Commits
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## What's changed"
            echo
            if [ -n "${PREV}" ]; then
              python3 scripts/release-notes.py "${PREV}..${GITHUB_REF_NAME}"
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              python3 scripts/release-notes.py "${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_dist.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_dist.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
