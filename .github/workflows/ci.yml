name: CI

# Lint, unit tests and a strict docs build on every pull request and master push.
# The end-to-end suites (real generated projects, real Docker builds) run on master
# pushes and, via workflow_call, before every release is published.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests
        run: uv run pytest -q

      - name: Docs (strict)
        run: uv run mkdocs build --strict

  e2e:
    # Not on pull requests: these need network and build Docker images.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OCTAVE_E2E: "1"
      OCTAVE_E2E_DOCKER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: End-to-end (generated projects and Docker images)
        run: uv run pytest -q -m e2e
