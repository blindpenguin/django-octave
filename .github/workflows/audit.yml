name: Audit

# Known-vulnerability check of the locked dependencies. Deliberately separate from
# CI: an unrelated new advisory must not block a pull request or a hotfix release.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
  workflow_dispatch:

permissions: {}

jobs:
  uv-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Audit locked dependencies
        run: uv audit --locked
